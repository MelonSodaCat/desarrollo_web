<!DOCTYPE html>
<html lang="es">
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
  <head>
    <title>Bienvenida</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/confesiones.css}" />
    <link rel="stylesheet" th:href="@{/css/modal.css}" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Roboto&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/new_styles.css}" />
  </head>
  <body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="avisos">
    <table>
  <thead>
    <tr>
      <th>Foto</th>
      <th>Fecha Ingreso</th>
      <th>Email</th>
      <th>Comuna</th>
      <th>Eliminar</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="p : ${data}">
      <td><img th:src="@{'/imgs/' + ${p['ruta_archivo']}}" th:alt="${p['nombre_archivo']}" style="max-height:80px;" class="aviso-image"/></td>  
      <td th:text="${#temporals.format(p['fecha_ingreso'], 'yyyy-MM-dd HH:mm')}"></td>
      <td th:text="${p['aviso_email']}"></td>
      <td th:text="${p['aviso_comuna']}"></td>
      <td>
        <button type="button" th:attr="data-id=${p['foto_id']}" class="delete-btn" th:onclick="'openModal(this)'">Eliminar</button>
      </td>
    </tr>
 </tbody>
    </table>
    </div>
    <!-- After your table -->
    <div th:replace="~{fragments/pagination :: pagination(currentPage=${currentPage}, totalPages=${totalPages}, baseUrl='/t5-admin-fotos')}"></div>



    <div id="deleteModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <h3>¿Eliminar foto?</h3>

        <form id="deleteForm" th:action="@{/t5-admin-fotos/delete}" method="post">
            <input type="hidden" name="fotoId" id="fotoIdInput"/>

            <label>Motivo:</label>
            <textarea name="motivo" id="motivoInput" required></textarea>
            <div id="motivoError" style="color: red; margin-top: 5px; display: none;"></div>

            <div class="modal-buttons">
                <button type="submit" class="confirm-btn">Confirmar</button>
                <button type="button" class="cancel-btn" id="cancelDelete">Cancelar</button>
            </div>
        </form>
    </div>
</div>
  </body>

   <script th:src="@{/js/admin_foto.js}"></script>

    
  </html>
